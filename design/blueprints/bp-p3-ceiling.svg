t-anchor="start" fill="#1d3557" font-weight="normal">上映中は間接照明・ダウンライトとも 25% ほどまで落とす。</text><rect x="10" y="10" width="1380" height="980" fill="none" stroke="#1d3557" stroke-width="1.5"/><rect x="800" y="930" width="590" height="60" fill="#fff" stroke="#1d3557"/><text x="810" y="954" font-size="16" fill="#1d3557" font-weight="bold">アンビエント・シネマ　P3 天井伏図（下から見上げ）</text><text x="810" y="978" font-size="12" fill="#1d3557">単位 m ／ 寸法の正本 design/layout.json ＋ blender/cinema_spec.py</text></svg>