="end" fill="#1d3557" font-weight="normal">← スクリーン側</text><rect x="40" y="40" width="16" height="14" fill="#c97a86" stroke="#1d3557" stroke-width="0.6"/><text x="64.0" y="52.0" font-size="12" text-anchor="start" fill="#1d3557" font-weight="normal">ベルベット（背・座面）</text><rect x="40" y="62" width="16" height="14" fill="#8d8a96" stroke="#1d3557" stroke-width="0.6"/><text x="64.0" y="74.0" font-size="12" text-anchor="start" fill="#1d3557" font-weight="normal">濃灰の金属（脚・側板）</text><rect x="40" y="84" width="16" height="14" fill="#e2c27a" stroke="#1d3557" stroke-width="0.6"/><text x="64.0" y="96.0" font-size="12" text-anchor="start" fill="#1d3557" font-weight="normal">真鍮（カップホルダー・縁）</text><text x="520.0" y="40.0" font-size="13" text-anchor="start" fill="#1d3557" font-weight="normal">肘掛けは隣の席と共有（列ごとに 9 本）。列の端は木の側板。</text><text x="520.0" y="60.0" font-size="13" text-anchor="start" fill="#1d3557" font-weight="normal">カップホルダーは肘掛けの前寄り（中心から 0.22 前）。</text><text x="520.0" y="80.0" font-size="13" text-anchor="start" fill="#1d3557" font-weight="normal">座席は Blender で1脚だけ作り、ワールドで 80 脚に並べる（インスタンス）。</text><text x="520.0" y="100.0" font-size="13" text-anchor="start" fill="#1d3557" font-weight="normal">座る判定は見えない箱（座面の上）。他の人が座っている席は座れない。</text><rect x="10" y="10" width="1380" height="800" fill="none" stroke="#1d3557" stroke-width="1.5"/><rect x="800" y="750" width="590" height="60" fill="#fff" stroke="#1d3557"/><text x="810" y="774" font-size="16" fill="#1d3557" font-weight="bold">ドパドバシネマ　P5 座席の詳細（正面・側面）</text><text x="810" y="798" font-size="12" fill="#1d3557">単位 m ／ 寸法の正本 design/layout.json ＋ blender/cinema_spec.py</text></svg>